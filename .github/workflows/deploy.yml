name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          # Pages had never been turned on for this repo, so this step failed on every run with
          # "Get Pages site failed ... Error: Not Found" -- which reads like a broken workflow
          # rather than an unset repository setting, and the site never deployed once.
          #
          # `enablement: true` is what the action's own error message points at, but on its own
          # it does NOT fix a repo where Pages has never been enabled. Measured here on
          # 2026-09-04: the read succeeded (404, meaning no site), then the create was refused --
          #
          #     Create Pages site failed. Error: Resource not accessible by integration
          #
          # `pages: write` lets GITHUB_TOKEN configure and deploy to an existing Pages site; it
          # does not let it bring one into existence. **The first enablement has to be done once
          # by a person**, either in Settings > Pages > Source: GitHub Actions, or with
          # `gh api -X POST repos/OWNER/REPO/pages -f build_type=workflow`.
          #
          # This stays set because it is a no-op once the site exists (the read succeeds and no
          # create is attempted), and it means a fresh fork or a re-created repo self-heals if
          # the job is ever run with a token that does have the rights.
          enablement: true
      - name: Upload website/ as the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "website"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
